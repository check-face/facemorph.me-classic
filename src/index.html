<!doctype html>
<html lang="en">
  <head>
    <base href="/">
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <% if (htmlWebpackPlugin.options.next) { %>
    <link rel="preload" as="image" href="/preview/hello-1024.webp" type="image/webp" fetchpriority="high">
    <% } %>
    <% if (!htmlWebpackPlugin.options.selfHost) { %>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-140064290-2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-140064290-2');
    </script>
    <% } %>
    <script>
      // when you click "Change Mode" in the explain.md
      function openChangeMode() {
        let btn = document.getElementById("leftval-changemodebtn");
        if(btn) {
          btn.scrollIntoView(false);
          btn.click();
        }
        return false;
      }
    </script>

    <!-- Self-hosted webfonts (AGENTS.md: no third-party CDN at runtime). Served from this
         origin so the first paint never waits on fonts.googleapis.com and the
         offline-capable-after-first-load claim holds. Sources and hashes: /fonts/RECEIPT.json -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/svg" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/favicon.svg" color="#ec792b">
    <meta name="msapplication-TileColor" content="#ec792b">
    <meta name="theme-color" content="#ec792b">

    <% if (htmlWebpackPlugin.options.next) { %>
    <!-- Social link previews. The classic build gets these from the SSR function in Server/;
         next is a static Workers Assets site, so they live in the template. -->
    <title>facemorph.me next: morph faces on your own device</title>
    <meta name="description" content="Make faces from words, seeds or photos and morph between them. The next facemorph.me runs entirely in your browser: nothing is uploaded.">
    <meta property="og:title" content="facemorph.me next: morph faces on your own device">
    <meta property="og:description" content="Make faces from words, seeds or photos and morph between them. Runs entirely in your browser: nothing is uploaded.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://next.facemorph.me/">
    <meta property="og:site_name" content="facemorph.me">
    <meta property="og:image" content="https://next.facemorph.me/og-next.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="facemorph.me next: a strip of generated faces morphing from one to another">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="facemorph.me next: morph faces on your own device">
    <meta name="twitter:description" content="Make faces from words, seeds or photos and morph between them. Runs entirely in your browser: nothing is uploaded.">
    <meta name="twitter:image" content="https://next.facemorph.me/og-next.png">
    <% } else { %>
    <title>facemorph.me</title>
    <% } %>
  </head>
  <body>
    <div id="elmish-app"></div>
  </body>
</html>
