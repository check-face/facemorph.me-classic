# FaceMorph classic distribution - one-command quickstart entry point.
#
#   ACCEPT_MODEL_TERMS=yes docker compose up
#
# from the repository root. CUDA is the default (the gpu overlay is included); the CPU
# override is `docker compose -f self-host/compose.yml up` (see self-host/README.md).
# Services live in self-host/compose.yml; this file only sets the project name and the
# default composition.
name: facemorph
# One include whose path is a list: the two files merge as `-f compose.yml -f compose.gpu.yml` would. Two separate
# includes that both define setup and api are a conflict on Compose v2 before overriding imports was allowed
# ("services.setup conflicts with imported resource").
include:
  - path:
      - self-host/compose.yml
      - self-host/compose.gpu.yml
