name: New site artifact
on:
  push:
    branches: ['candidate/next-delivery-20260916']
    paths: ['src/**', 'desktop/runtime.mjs', 'scripts/build-next.cjs', 'scripts/check-next-artifact.sh', 'scripts/next-e2e-server.py', 'scripts/next-e2e-browser.py', 'webpack.config.js', 'package*.json', '.config/**', 'hosting/next*/**', 'photo-runtime/**', '.github/workflows/next-site.yml', '.github/workflows/next-e2e.yml']
  pull_request:
    paths: ['src/**', 'desktop/runtime.mjs', 'scripts/build-next.cjs', 'scripts/check-next-artifact.sh', 'scripts/next-e2e-server.py', 'scripts/next-e2e-browser.py', 'webpack.config.js', 'package*.json', '.config/**', 'hosting/next*/**', 'photo-runtime/**', '.github/workflows/next-site.yml', '.github/workflows/next-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  artifact:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: mcr.microsoft.com/dotnet/sdk:5.0-focal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Every test file under src/Next runs here. crop-queue and encoder-preflight were written
      # with the fixes they cover and then never named in this list, so the queueing behaviour the
      # operator reported — crops cancelling each other — had no gate at all. check-test-coverage
      # fails the build when a new test file is written and not added.
      - name: Every test file is actually run
        run: node scripts/check-tests-listed.mjs
      - name: Shipping runtime, media, privacy and input regressions
        run: node --test src/Next/image-encoder.test.mjs src/Next/scheduler.test.mjs src/Next/recovery-metadata.test.mjs src/Next/infill.test.mjs src/Next/last-result.test.mjs src/Next/analytics.test.mjs hosting/next-static/analytics.test.mjs src/Next/video-worker.test.mjs src/Next/browser/route-priors.test.mjs src/Next/Assets/model-cache.test.mjs src/Next/browser/runtime.test.mjs src/Next/browser/mobile-runtime.test.mjs src/Next/browser/originals.test.mjs src/Next/browser/webgpu-engine.test.mjs src/Next/browser/canary-qualification.test.mjs src/Next/browser/acquisition-budget.test.mjs src/Next/browser/fused-resample.test.mjs src/Next/media.test.mjs src/Next/morph-frames.test.mjs src/Next/fresh-review.test.mjs src/Next/photo-selection.test.mjs src/Next/crop-queue.test.mjs src/Next/browser/encoder-preflight.test.mjs src/Next/photo/crop-view.test.mjs src/Next/estimate.test.mjs src/Next/testing-link.test.mjs src/Next/route-choice.test.mjs src/Next/route-report.test.mjs src/Next/reporting.test.mjs src/Next/stage-labels.test.mjs src/Next/storage-request.test.mjs src/Next/model-inventory.test.mjs src/Next/logging.test.mjs src/Next/public-previews.test.mjs hosting/next-cloudflare/worker.test.mjs hosting/next-mirror/worker.test.mjs
      - name: Compiled UI imports resolve against the hand-written bridges
        run: node scripts/check-bridge-imports.mjs
      # Operator release gate: while a morph renders the line increments an integer and says
      # nothing else. "Generating images" and "Encoding" are banned from that moment.
      - name: Morph progress line is a counter, not a flicker
        run: node scripts/check-progress-copy.mjs
      - name: Independent reviewed morph geometry
        run: node src/Next/geometry/verify.mjs
      - name: Build the actual new-site artifact
        run: npm run build:next
      - name: Historic hello preview is included byte for byte
        run: cmp src/public/preview/hello-1024.webp deploy-next/preview/hello-1024.webp
      - name: Exercise compiled project import and export
        run: node src/Next/verify-fable.mjs src/Next/ProjectJson.fs.js
      # AGENTS.md, binding: no third-party CDN at runtime. The ffmpeg codec and the webfonts
      # were both violating it, and the fonts also broke the offline-after-first-load claim.
      - name: No third-party runtime dependencies
        run: node scripts/check-no-third-party.mjs deploy-next
      - name: Record exact bytes for promotion
        run: |
          find deploy-next -type f -print0 | sort -z | xargs -0 sha256sum > next-site-SHA256SUMS
          printf '%s\n' '${{ github.sha }}' > next-site-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: next-site-${{ github.sha }}
          path: |
            deploy-next/
            next-site-SHA256SUMS
            next-site-source.txt
          if-no-files-found: error
          retention-days: 14
  # Every new candidate artifact is qualified through the real product workflow automatically.
  # workflow_run only fires for workflows on the default branch, so the build calls it directly.
  qualify:
    # next-e2e.yml accepts branch artifacts, not PR merge artifacts.
    # PRs still run the artifact tests/build and compiled-ui checks.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: artifact
    uses: ./.github/workflows/next-e2e.yml
    permissions:
      contents: read
      actions: read
    with:
      artifact_run: ${{ github.run_id }}
      artifact_name: next-site-${{ github.sha }}
      runtime_sha: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
  compiled-ui:
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: next-site-${{ github.sha }}
      - name: Verify exact built bytes
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          test "$(cat next-site-source.txt)" = "$EXPECTED_SOURCE"
          test -s deploy-next/index.html
          sha256sum --check next-site-SHA256SUMS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The served WebGPU bundle and the shipped engine are staged from different inputs and
      # promoted separately; nothing stopped them drifting until they did, and every WebGPU
      # device fell back to CPU after a 183 MB download. This guards the gate that catches it.
      # A qualification server that does not parse fails the e2e lane minutes later with a
      # stack trace in an uploaded log, not at the commit that broke it. These scripts are
      # never imported by a test, so nothing else reads them until CI runs them for real.
      - name: Publication and qualification scripts parse
        run: python3 -m compileall -q scripts hosting/next hosting/next-static src/Next/browser
      - name: WebGPU bundle contract gate
        run: python3 -m unittest discover -s hosting/next-static -p 'webgpu_contract_test.py' -t hosting/next-static
      - name: Install browser controller
        run: python -m pip install browser-harness==0.1.8
      - name: Run actual artifact in Chromium
        env:
          BU_CDP_URL: http://127.0.0.1:9222
        run: |
          python -m http.server 8080 --directory deploy-next > "$RUNNER_TEMP/next-http.log" 2>&1 &
          server_pid=$!
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/next-chrome" about:blank > "$RUNNER_TEMP/next-chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$server_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          bash scripts/check-next-artifact.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-artifact-ui-evidence
          path: |
            next-artifact-ui.json
            ${{ runner.temp }}/next-http.log
            ${{ runner.temp }}/next-chrome.log
          if-no-files-found: warn
          retention-days: 14
  # Every candidate push that builds, qualifies through the real product workflow and passes the
  # compiled-UI check goes live on next.facemorph.me (operator, 9 October: next is a preview, and
  # deploys go through CI, not an operator's machine). The runtime is rebuilt from the pinned
  # manifest by mirror-runtime.py, every file checked against its digest, and cached by manifest
  # hash; the frontend is the exact artifact the qualification tested. Rollback: `wrangler
  # versions deploy <previous version>@100`, the previous version is in `wrangler deployments list`.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/candidate/next-delivery-20260916'
    needs: [artifact, qualify, compiled-ui]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: next-deploy
      cancel-in-progress: false
    environment:
      name: next-preview
      url: https://next.facemorph.me/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: next-site-${{ github.sha }}
          path: web
      - name: Verify the artifact is the one that was built and qualified
        run: cd web && sha256sum --quiet -c next-site-SHA256SUMS
      - name: Restore the runtime mirror
        uses: actions/cache@v4
        with:
          path: .runtime-public
          key: runtime-public-${{ hashFiles('hosting/next-static/runtime-overlay/manifest.json', 'hosting/next-static/mirror-runtime.py') }}
          restore-keys: runtime-public-
      - name: Rebuild the runtime from the pinned manifest
        run: |
          python3 hosting/next-static/mirror-runtime.py --output .runtime-public
          python3 hosting/next-static/webgpu_contract.py --runtime .runtime-public
      - name: Stage
        # The names index must be the one built into the qualified artifact (promote.py's rule).
        run: |
          cmp hosting/next-static/catalogue.json web/deploy-next/catalogue.json
          python3 hosting/next-static/stage.py --runtime .runtime-public --frontend web/deploy-next --catalogue hosting/next-static/catalogue.json --output public
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4.149.0 deploy --config hosting/next-static/wrangler.jsonc --assets public \
            --message "CI ${GITHUB_SHA::7}: next-site run ${GITHUB_RUN_ID}, qualified in the same run"
      - name: Check the live site serves this build
        run: |
          app=$(ls web/deploy-next | grep -E '^app\.[0-9a-f]+\.js$')
          for attempt in $(seq 1 20); do curl -fsS https://next.facemorph.me/ | grep -q "$app" && exit 0; sleep 6; done
          echo "next.facemorph.me is not serving $app"; exit 1
      - name: Check the live historic hello preview
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://next.facemorph.me/preview/hello-1024.webp --output "$RUNNER_TEMP/hello-1024.webp"
          cmp src/public/preview/hello-1024.webp "$RUNNER_TEMP/hello-1024.webp"
      # Qualification runs before the deploy, against the old origin, so it cannot see a file the
      # new tree left out (the first CI deploy dropped the photo worker's sibling modules). Every
      # staged runtime file must answer from the live site.
      - name: Check the live site serves every runtime file
        run: |
          cd public && find runtime -type f ! -name index.html | sort > ../runtime-files
          # New assets take a minute or two to reach every edge after the deploy returns.
          for attempt in $(seq 1 12); do
            missing=$(xargs -P 16 -I{} sh -c 'code=$(curl -s -o /dev/null -I -w "%{http_code}" "https://next.facemorph.me/{}"); [ "$code" = 200 ] || echo "$code {}"' < ../runtime-files)
            [ -z "$missing" ] && break
            echo "attempt $attempt: $(echo "$missing" | wc -l) not served yet"; sleep 15
          done
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
          echo "$(wc -l < ../runtime-files) runtime files served"
      # models.facemorph.me (hosting/next-mirror) is the second copy the page falls back to when a
      # chunk keeps failing here. It copies each immutable runtime file on first request; warming
      # every one now means the copy is complete before any visitor needs it.
      - name: Deploy the runtime mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.149.0 deploy --config hosting/next-mirror/wrangler.jsonc --message "CI ${GITHUB_SHA::7}"
      - name: Warm the runtime mirror with every immutable runtime file
        run: |
          grep -E '^runtime/(assets|chunks|manifests|photo|encoder-stream)/' runtime-files > mirrored-files
          failed=$(xargs -P 8 -I{} sh -c 'code=$(curl -s -o /dev/null -I --retry 3 --retry-all-errors -w "%{http_code}" "https://models.facemorph.me/{}"); [ "$code" = 200 ] || echo "$code {}"' < mirrored-files)
          [ -z "$failed" ] || { echo "$failed"; exit 1; }
          echo "$(wc -l < mirrored-files) runtime files held by models.facemorph.me"
