name: Self-host README rot check
# fm-fy2.16: the README is the test. self-host/readme_test.py runs the README's marked quickstart and CPU blocks
# verbatim, from a clean clone into empty volumes with a fresh build cache, and checks what the README promises.
# A failure on the distribution branch (a push, the monthly run or a dispatch) opens or updates one issue for the
# classic distribution workstream. Classic is frozen: a rot failure is fixed by restoring the pinned input, or by the
# minimal re-pin of an input that is gone for good behind this same acceptance; never by a general dependency bump.
# A dead upstream weight link is reported as such, not worked around.
#
# Scheduled workflows run from the default branch's files: the monthly run starts once self-host is the default.
on:
  push:
    branches: [self-host]
    paths: ['compose.yaml', 'self-host/**', '.github/workflows/self-host-rot.yml']
  pull_request:
    paths: ['compose.yaml', 'self-host/**', '.github/workflows/self-host-rot.yml']
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      cell:
        description: 'One cell only (cpu, gpu-absent, gpu, gpu-unsupported), or all'
        type: choice
        options: [all, cpu, gpu-absent, gpu, gpu-unsupported]
        default: all
      forced_failure:
        description: 'A forced rot failure from a fixture branch: the report opens its issue, titled [forced]'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: self-host-rot-${{ github.ref }}
  cancel-in-progress: false
env:
  # A canonical run clones exactly what the README names. Any other ref is a development run: the harness clones this
  # repository at that ref instead, the only substitution it allows, logged and labelled in result.json.
  DEV_ARGS: >-
    ${{ (github.event_name == 'pull_request' || github.ref_name != 'self-host')
        && format('--repo {0}/{1}.git --branch {2}', github.server_url, github.repository, github.head_ref || github.ref_name)
        || '' }}
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cd self-host && python3 -m unittest test_readme_test

  cpu:
    # The CPU cells: hosted Linux amd64 and arm64.
    needs: harness
    if: (inputs.cell || 'all') == 'all' || inputs.cell == 'cpu'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: A browser for the frontend check (the arm64 image has no Chrome; Playwright's Chromium covers both)
        run: |
          npx -y playwright@1.56.1 install --with-deps chromium >/dev/null
          echo "CHROME=$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)" >> "$GITHUB_ENV"
      - name: README CPU block, verbatim, from an empty directory
        run: python3 self-host/readme_test.py --mode cpu --out evidence --min-free-gib 12 --chrome "$CHROME" $DEV_ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-test-cpu-${{ matrix.runner }}
          path: evidence/
          retention-days: 30

  gpu-absent:
    # A host without an NVIDIA runtime: the quickstart fails clearly at the GPU reservation, never on CPU.
    needs: harness
    if: (inputs.cell || 'all') == 'all' || inputs.cell == 'gpu-absent'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 self-host/readme_test.py --mode gpu-absent --out evidence --min-free-gib 12 $DEV_ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-test-gpu-absent
          path: evidence/
          retention-days: 30

  gpu:
    # The planned CUDA cell: RTX 2080 SUPER (Turing) on the workstation, the only runner with a GPU inside the cu128
    # wheels' architectures (the GTX 1080 and GTX 1050 runners are Pascal, 6.1). The workstation is shared and its
    # disk is tight, so the GPU cells run only monthly and on dispatch, never per push or pull request; the harness
    # refuses to start below 35 GiB free and removes the image, volumes and build cache when it ends.
    needs: harness
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.cell == 'all' || inputs.cell == 'gpu'))
    runs-on: [self-hosted, gpu-rtx2080s]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: README quickstart, verbatim, CUDA
        run: python3 self-host/readme_test.py --mode gpu --out evidence --workdir "$RUNNER_TEMP" $DEV_ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-test-gpu-rtx2080s
          path: evidence/
          retention-days: 90
      - name: Remove anything a killed harness left (its containers, volumes, images and builder)
        if: always()
        run: |
          for p in $(docker ps -a --format '{{.Label "com.docker.compose.project"}}' | grep '^readmetest-' | sort -u); do
            docker ps -aq --filter "label=com.docker.compose.project=$p" | xargs -r docker rm -f
          done
          docker volume ls -q --filter label=com.docker.compose.project | grep '^readmetest-' | xargs -r docker volume rm
          docker images --format '{{.Repository}}:{{.Tag}}' | grep '^readmetest-' | xargs -r docker rmi -f
          docker buildx ls --format '{{.Name}}' | grep '^readmetest-' | xargs -r -n1 docker buildx rm --force
          df -h "$(docker info --format '{{.DockerRootDir}}')" | tail -1

  gpu-unsupported:
    # The Pascal cell (operator, 24 October): triton's GTX 1080, compute capability 6.1, outside the cu128 wheels'
    # kernels. The default CUDA start must stop at the capability check with its plain message, and the CPU override
    # must then serve a face on the same host. The TrueNAS GTX 1050 is an optional extra cell: its runner user cannot
    # reach Docker without sudo, so it stays untested until the operator grants that.
    needs: harness
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.cell == 'all' || inputs.cell == 'gpu-unsupported'))
    runs-on: [self-hosted, gpu-gtx1080]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Compose v2.20+ for this job only, if the host's is older (the README's stated requirement)
        # triton (Ubuntu 20.04) has Compose v2.2.3, which rejects the root compose.yaml's `include`. A pinned, checksummed
        # Compose goes into a job-local Docker config; the host's own Docker setup is untouched.
        run: |
          # `--short` is newer than some Compose v2 releases (v2.2.3 prints nothing), so parse the full version line.
          v=$(docker compose version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "host Compose: ${v:-none}"
          if [ -n "$v" ] && [ "$(printf '%s\n2.20.0\n' "$v" | sort -V | head -1)" = 2.20.0 ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/docker/cli-plugins"
          [ -f ~/.docker/config.json ] && cp ~/.docker/config.json "$RUNNER_TEMP/docker/" || true
          curl -fsSL -o "$RUNNER_TEMP/docker/cli-plugins/docker-compose" \
            https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
          echo "383ce6698cd5d5bbf958d2c8489ed75094e34a77d340404d9f32c4ae9e12baf0  $RUNNER_TEMP/docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/docker/cli-plugins/docker-compose"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$RUNNER_TEMP/docker" docker compose version
      - run: python3 self-host/readme_test.py --mode gpu-unsupported --out evidence --workdir "$RUNNER_TEMP" --min-free-gib 30 $DEV_ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-test-gpu-gtx1080
          path: evidence/
          retention-days: 90
      - name: Remove anything a killed harness left (its containers, volumes, images and builder)
        if: always()
        run: |
          for p in $(docker ps -a --format '{{.Label "com.docker.compose.project"}}' | grep '^readmetest-' | sort -u); do
            docker ps -aq --filter "label=com.docker.compose.project=$p" | xargs -r docker rm -f
          done
          docker volume ls -q --filter label=com.docker.compose.project | grep '^readmetest-' | xargs -r docker volume rm
          docker images --format '{{.Repository}}:{{.Tag}}' | grep '^readmetest-' | xargs -r docker rmi -f
          docker buildx ls --format '{{.Name}}' | grep '^readmetest-' | xargs -r -n1 docker buildx rm --force
          df -h "$(docker info --format '{{.DockerRootDir}}')" | tail -1

  report:
    needs: [harness, cpu, gpu-absent, gpu, gpu-unsupported]
    # The distribution branch, or a forced failure dispatched from a fixture branch to prove the path.
    if: failure() && github.event_name != 'pull_request' && (github.ref_name == 'self-host' || inputs.forced_failure)
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: readme-test-*
          path: evidence
      - name: Open or update the classic distribution rot issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCED: ${{ inputs.forced_failure && '[forced] ' || '' }}
        run: |
          python3 self-host/rot_report.py evidence "$RESULTS" "$RUN" > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          title="${FORCED}Self-host README rot check failing"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi
